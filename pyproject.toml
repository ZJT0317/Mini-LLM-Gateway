[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-gateway"
version = "0.1.0"
description = "A small OpenAI-compatible LLM gateway."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema[format]>=4.23,<5",
  "referencing>=0.35,<1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "openai>=2.0,<3", "ruff>=0.15", "python-dotenv>=1.0", "mypy>=1.15,<3"]

[project.scripts]
mini-llm-gateway = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Preserve the existing correctness checks across Ruff default-rule changes.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
  "app/core/admission.py",
  "app/core/models.py",
  "app/services/accounting.py",
  "app/services/execution.py",
  "app/services/gateway.py",
  "app/services/router.py",
  "app/services/upstream.py",
  "app/main.py",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
