services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GATEWAY_DEMO_KEY: ${GATEWAY_DEMO_KEY}
      GATEWAY_DATABASE: /srv/data/gateway.db
    volumes:
      - ./gateway.yaml:/srv/gateway.yaml:ro
      - ./prompts:/srv/prompts:ro
      - gateway-data:/srv/data
    command: ["mini-llm-gateway", "--config", "/srv/gateway.yaml"]

volumes:
  gateway-data:
